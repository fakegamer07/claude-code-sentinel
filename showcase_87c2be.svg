<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(228, 18%, 7%)"/>
      <stop offset="100%" stop-color="hsl(228, 18%, 12%)"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="hsl(143, 58%, 51%)"/>
      <stop offset="100%" stop-color="hsl(203, 77%, 51%)"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="hsl(228, 14%, 19%)"/>
      <stop offset="100%" stop-color="hsl(228, 12%, 10%)"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(143, 70%, 55%)" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="hsl(143, 70%, 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(203, 70%, 55%)" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="hsl(203, 70%, 55%)" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="tone">
      <feColorMatrix type="saturate" values="0.80"/>
      <feColorMatrix type="matrix" values="
  0.90 0 0 0 0
  0 0.90 0 0 0
  0 0 0.90 0 0
  0 0 0 1 0"/>
    </filter>
    <clipPath id="titleClip"><rect x="220" y="200" width="710" height="100"/></clipPath>
    <clipPath id="installerClip"><rect x="220" y="295" width="710" height="100"/></clipPath>
    <clipPath id="subtitleClip"><rect x="220" y="380" width="710" height="55"/></clipPath>
  </defs>

  <g filter="url(#tone)">

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="hsl(228, 14%, 21%)" stroke-width="0.5"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.32"/>

  <!-- Accent glow blobs -->
  <ellipse cx="239" cy="297" rx="290" ry="207" fill="url(#blobA)"/>
  <ellipse cx="1047" cy="297" rx="290" ry="207" fill="url(#blobB)"/>

  <!-- Accent bars -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentGrad)"/>
  <rect x="0" y="636" width="1280" height="4" fill="url(#accentGrad)"/>
  <rect x="80" y="80" width="3" height="480" fill="url(#accentGrad)" opacity="0.51"/>

  <!-- Package box icon -->
  <g transform="translate(100, 200)" filter="url(#shadow)">
    <rect x="0" y="16" width="80" height="64" fill="hsl(228, 14%, 20%)"
          stroke="hsl(228, 12%, 26%)" stroke-width="2" rx="6"/>
    <polygon points="0,16 40,0 80,16 40,32"
             fill="hsl(228, 14%, 22%)"
             stroke="hsl(228, 12%, 26%)" stroke-width="2"/>
    <rect x="34" y="0" width="12" height="32" fill="hsl(143, 65%, 52%)" opacity="0.85"/>
    <line x1="40" y1="32" x2="40" y2="80" stroke="hsl(228, 12%, 26%)" stroke-width="2"/>
    <g transform="translate(40, 56)">
      <line x1="0" y1="-12" x2="0" y2="12" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
      <polyline points="-9,3 0,12 9,3" fill="none" stroke="url(#accentGrad)"
                stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Gear -->
  <g transform="translate(140, 380)" filter="url(#shadow)">
    <g fill="hsl(228, 12%, 30%)" stroke="hsl(228, 10%, 35%)" stroke-width="1.5">
      <rect x="-4" y="-34" width="8" height="14" rx="1"/>
      <rect x="-4" y="-34" width="8" height="14" rx="1" transform="rotate(45)"/>
      <rect x="-4" y="-34" width="8" height="14" rx="1" transform="rotate(90)"/>
      <rect x="-4" y="-34" width="8" height="14" rx="1" transform="rotate(135)"/>
      <rect x="-4" y="-34" width="8" height="14" rx="1" transform="rotate(180)"/>
      <rect x="-4" y="-34" width="8" height="14" rx="1" transform="rotate(225)"/>
      <rect x="-4" y="-34" width="8" height="14" rx="1" transform="rotate(270)"/>
      <rect x="-4" y="-34" width="8" height="14" rx="1" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="24" fill="hsl(228, 14%, 19%)"
            stroke="hsl(228, 10%, 35%)" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="hsl(228, 16%, 7%)"
            stroke="hsl(228, 10%, 35%)" stroke-width="2"/>
  </g>

  <!-- Title -->
  <g clip-path="url(#titleClip)">
    <text id="projectName" x="220" y="278"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="64" font-weight="700" letter-spacing="-1.5"
          fill="#ffffff" filter="url(#glow)"
          textLength="710" lengthAdjust="spacingAndGlyphs">claude-code-sentinel</text>
  </g>

  <!-- Installer accent -->
  <g clip-path="url(#installerClip)">
    <text x="220" y="358"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="64" font-weight="700" letter-spacing="-1.5"
          fill="url(#accentGrad)" filter="url(#glow)">Installer</text>
  </g>

  <!-- Subtitle -->
  <g clip-path="url(#subtitleClip)">
    <text x="222" y="405"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="22" font-weight="400"
          fill="hsl(228, 10%, 62%)" letter-spacing="0.5">One-click installer</text>
  </g>

  <line x1="220" y1="445" x2="900" y2="445" stroke="hsl(228, 12%, 30%)" stroke-width="1"/>

  <!-- Badge 1: Windows + macOS -->
  <g transform="translate(222, 465)">
    <rect x="0" y="0" width="200" height="36" fill="hsl(228, 14%, 19%)" rx="18"
          stroke="hsl(228, 12%, 30%)" stroke-width="1"/>
    <g transform="translate(16, 11.5)">
      <rect x="0" y="0" width="6" height="6" fill="#0078d4"/>
      <rect x="7" y="0" width="6" height="6" fill="#0078d4"/>
      <rect x="0" y="7" width="6" height="6" fill="#0078d4"/>
      <rect x="7" y="7" width="6" height="6" fill="#0078d4"/>
    </g>
    <text x="36" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e6edf3" font-weight="500">Windows</text>
    <text x="104" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#484f58">+</text>
    <g transform="translate(112.6, 9.55)" fill="#e6edf3">
      <path d="M11.6 11.2c0-2 1.6-2.9 1.7-3-0.9-1.3-2.3-1.5-2.8-1.5-1.2-0.1-2.3 0.7-2.9 0.7-0.6 0-1.5-0.7-2.5-0.7-1.3 0-2.5 0.7-3.2 1.9-1.4 2.4-0.3 5.9 1 7.9 0.7 1 1.5 2 2.5 2 1 0 1.4-0.6 2.6-0.6 1.2 0 1.5 0.6 2.6 0.6 1.1 0 1.7-1 2.4-2 0.8-1.1 1.1-2.2 1.1-2.3-0.1 0-2.1-0.8-2.1-3z"/>
      <path d="M9.5 5c0.5-0.6 0.9-1.5 0.8-2.4-0.8 0-1.7 0.5-2.2 1.2-0.5 0.5-0.9 1.5-0.8 2.3 0.9 0.1 1.7-0.5 2.2-1.1z"/>
    </g>
    <text x="134" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e6edf3" font-weight="500">macOS</text>
  </g>

  <!-- Badge 2: MIT -->
  <g transform="translate(434, 465)">
    <rect x="0" y="0" width="120" height="36" fill="hsl(228, 14%, 19%)" rx="18"
          stroke="hsl(228, 12%, 30%)" stroke-width="1"/>
    <text x="16" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="hsl(143, 65%, 55%)" font-weight="600">MIT</text>
    <text x="46" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e6edf3">License</text>
  </g>

  <!-- Badge 3: Auto-Update -->
  <g transform="translate(566, 465)">
    <rect x="0" y="0" width="160" height="36" fill="hsl(228, 14%, 19%)" rx="18"
          stroke="hsl(228, 12%, 30%)" stroke-width="1"/>
    <text x="16" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="hsl(203, 70%, 55%)" font-weight="500">Auto-Update CI</text>
  </g>

  <!-- Badge 4: Open Source -->
  <g transform="translate(738, 465)">
    <rect x="0" y="0" width="140" height="36" fill="hsl(228, 14%, 19%)" rx="18"
          stroke="hsl(228, 12%, 30%)" stroke-width="1"/>
    <text x="16" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="hsl(23, 80%, 65%)" font-weight="500">Open Source</text>
  </g>

  <!-- Terminal card -->
  <g transform="translate(950, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="400" fill="url(#cardGrad)" rx="12"
          stroke="hsl(228, 12%, 30%)" stroke-width="1"/>
    <rect x="0" y="0" width="260" height="36" fill="hsl(228, 14%, 19%)" rx="12"/>
    <rect x="0" y="24" width="260" height="12" fill="hsl(228, 14%, 19%)"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <text x="130" y="23" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">install.sh</text>
    <text x="16" y="68" font-family="'Courier New', monospace" font-size="13" fill="hsl(143, 65%, 55%)">$ ./install.sh</text>
    <text x="16" y="94" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">[INFO] Detecting OS...</text>
    <text x="16" y="116" font-family="'Courier New', monospace" font-size="12" fill="hsl(143, 65%, 55%)">[OK]   Windows / macOS</text>
    <text x="16" y="138" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">[INFO] Resolving target...</text>
    <text x="16" y="160" font-family="'Courier New', monospace" font-size="12" fill="hsl(143, 65%, 55%)">[OK]   Target located</text>
    <text x="16" y="182" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">[INFO] Downloading...</text>
    <rect x="16" y="196" width="228" height="8" fill="hsl(228, 12%, 30%)" rx="4"/>
    <rect x="16" y="196" width="178" height="8" fill="url(#accentGrad)" rx="4"/>
    <text x="16" y="222" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">[INFO] Installing files...</text>
    <text x="16" y="244" font-family="'Courier New', monospace" font-size="12" fill="hsl(143, 65%, 55%)">[OK]   Files copied</text>
    <text x="16" y="266" font-family="'Courier New', monospace" font-size="12" fill="hsl(143, 65%, 55%)">[OK]   Config applied</text>
    <text x="16" y="288" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">----------------------------</text>
    <text x="16" y="314" font-family="'Courier New', monospace" font-size="14" fill="#ffffff" font-weight="bold">Installation complete!</text>
    <text x="16" y="336" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">Ready to launch.</text>
    <rect x="16" y="358" width="10" height="16" fill="hsl(143, 65%, 55%)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom URL hint -->
  <text x="640" y="610" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="16"
        fill="hsl(228, 12%, 30%)" letter-spacing="1">github.com / claude-code-sentinel</text>

  </g>
</svg>
